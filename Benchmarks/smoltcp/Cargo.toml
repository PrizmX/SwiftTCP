[package]
name = "smoltcp-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "alloc",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "socket-icmp",
] }
